# Security checks.
#
# Dependencies (every push/PR, and daily so a new advisory against an
# unchanged lock file still turns this red):
# - composer-audit: Packagist/GitHub advisories in composer.lock.
# - npm-audit: the root tooling (ESLint/Stylelint) and the larpnet_matrix
#   chat client. Anything in a production dependency fails it; in dev-only
#   tooling, high and critical do.
#
# Published images :prod and :test (daily, and after every image build):
# - image-scan / PHP: the PHP inside the image must be the newest patch
#   release of its minor (php.net), and that minor must still get security
#   fixes. Images only pick up a PHP patch release when they're rebuilt
#   (build.yml pulls a fresh php:<minor>-fpm-trixie base every build), so a
#   failure here means "rebuild": push to larpnet-test, then cut a release-*
#   tag. Right after a php.net release this can fail for a day or so until
#   docker-library publishes the matching php image.
# - image-scan / Trivy: fixable HIGH/CRITICAL vulnerabilities in the image's
#   Debian packages, PHP/JS dependencies and binaries. Accepted findings, each
#   with its reason, live in .trivyignore.

name: Security

on:
  push:
    branches: [larpnet, larpnet-test]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_run:
    workflows: [Build larpnet image]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer audit
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      # Checks composer.lock directly; nothing needs installing. Abandoned
      # packages (no replacement available) are listed but don't fail it.
      - name: Audit locked PHP dependencies
        run: composer audit --locked --abandoned=report

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [., addon/larpnet_matrix/client]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Production dependencies (any severity)
        run: npm audit --omit=dev --audit-level=low

      - name: All dependencies (high and critical)
        run: npm audit --audit-level=high

  image-scan:
    name: Image scan (${{ matrix.tag }})
    # Needs the registry secrets, and checks what's published rather than the
    # change itself, so it doesn't run for pushes or pull requests.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [prod, test]
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: PHP is the latest patch of a supported minor
        run: |
          set -euo pipefail
          running=$(docker run --rm --entrypoint php "$IMAGE" -r 'echo PHP_VERSION;')
          minor=$(echo "$running" | cut -d. -f1,2)
          latest=$(curl -fsS "https://www.php.net/releases/?json&version=$minor" | jq -r .version)
          state=$(curl -fsS "https://www.php.net/releases/states.php" | jq -r --arg m "$minor" '.[($m | split(".")[0])][$m].state // "unknown"')
          echo "$IMAGE: PHP $running (latest $minor: $latest, branch state: $state)"
          {
            echo "### PHP in \`${{ matrix.tag }}\`"
            echo "Running **$running**, latest $minor release **$latest**, branch state **$state**."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$state" != "stable" ] && [ "$state" != "security" ]; then
            echo "::error::PHP $minor no longer gets security fixes (state: $state) -- move PHP_IMAGE in the Dockerfile to a supported minor."
            exit 1
          fi
          if [ "$running" != "$latest" ]; then
            echo "::error::$IMAGE runs PHP $running but $latest is out -- rebuild the image (push to larpnet-test, then cut a release-* tag)."
            exit 1
          fi

      # Runs even when the PHP check failed, so one red run shows everything.
      # The official image pinned by digest rather than aquasecurity/
      # trivy-action, whose tags were hijacked in a 2026 supply-chain attack.
      - name: Trivy (fixable HIGH/CRITICAL)
        if: success() || failure()
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 "$IMAGE"
