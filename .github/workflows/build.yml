name: Build larpnet image

on:
  push:
    branches: [larpnet, staging]
  workflow_dispatch:

env:
  IMAGE: cr.mj12.cloud/friendica-larpnet

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: cr.mj12.cloud
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract versions
        id: version
        run: |
          FRIENDICA=$(grep '^FROM friendica:' Dockerfile | sed 's/FROM friendica:\(.*\)-fpm/\1/')
          LARPNET=$(git rev-parse --short HEAD)
          echo "tag=${FRIENDICA}-${LARPNET}" >> "$GITHUB_OUTPUT"

      # staging builds only ever publish the mutable :test tag that the
      # test-environment's watchtower polls — they must never touch :latest
      # or the versioned tag, which are production's.
      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.ref_name }}" == "staging" ]]; then
            TAGS="${{ env.IMAGE }}:test"
          else
            TAGS="${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
